# AIMurahV3 reverse proxy example (nginx).
# Puts TLS in front of the proxy (7830) and dashboard (7831) and limits the
# dashboard login endpoint to dampen brute-force. Copy to /etc/nginx/sites-
# available/aimurahv3 and `ln -s` into sites-enabled.

# Rate limit bucket: 10 req/s per client IP on the /api/auth/login path.
limit_req_zone $binary_remote_addr zone=aimurah_login:10m rate=10r/m;

upstream aimurah_proxy {
    server 127.0.0.1:7830;
    keepalive 32;
}

upstream aimurah_dashboard {
    server 127.0.0.1:7831;
    keepalive 8;
}

# ---- Proxy API (OpenAI / Anthropic compatible) ----
server {
    listen 443 ssl http2;
    server_name proxy.example.com;

    ssl_certificate     /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;

    client_max_body_size 8m;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;      # streaming responses need flushing
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://aimurah_proxy;
    }
}

# ---- Dashboard ----
server {
    listen 443 ssl http2;
    server_name dash.example.com;

    ssl_certificate     /etc/letsencrypt/live/dash.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.example.com/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Strict rate limit on login — the app also has an in-memory lockout,
    # this layer catches the distributed noise before it hits Python.
    location = /api/auth/login {
        limit_req zone=aimurah_login burst=5 nodelay;
        proxy_pass http://aimurah_dashboard;
    }

    location / {
        proxy_pass http://aimurah_dashboard;
    }
}

# Optional HTTP -> HTTPS redirect
server {
    listen 80;
    server_name proxy.example.com dash.example.com;
    return 301 https://$host$request_uri;
}
